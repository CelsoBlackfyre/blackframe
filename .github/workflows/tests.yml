name: Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: frame_testing
      DB_USERNAME: frame
      DB_PASSWORD: frame_local_dev

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: frame_testing
          POSTGRES_USER: frame
          POSTGRES_PASSWORD: frame_local_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U frame -d frame_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test
